<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orion</title>
<meta name="description" content="A Windows 11 desktop emulator with Microsoft Edge, running entirely in the browser.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/orion.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orion">
<link rel="apple-touch-icon" href="assets/orion-maskable.svg">
<link rel="stylesheet" href="styles/base.css?v=28">
<link rel="stylesheet" href="styles/shell.css?v=28">
<link rel="stylesheet" href="styles/windows.css?v=28">
<link rel="stylesheet" href="styles/apps.css?v=28">
<link rel="stylesheet" href="styles/features.css?v=28">
<link rel="stylesheet" href="styles/games.css?v=28">
<link rel="stylesheet" href="styles/access.css?v=28">
<link rel="stylesheet" href="styles/youtube.css?v=28">
<link rel="stylesheet" href="styles/office.css?v=28">
<link rel="stylesheet" href="styles/tour.css?v=28">
<link rel="stylesheet" href="styles/mac.css?v=28">
<link rel="stylesheet" href="styles/music.css?v=28">
<link rel="stylesheet" href="styles/learn.css?v=28">
</head>
<body>

<!-- ============ ACCESS GATE ============ -->
<div id="gate" class="screen gate hidden">
  <div class="gate-card">
    <img class="gate-logo" src="assets/orion.svg" width="76" height="76" alt="">
    <div class="gate-brand">Orion</div>
    <div id="gateBody"></div>
  </div>
</div>

<!-- ============ BOOT ============ -->
<div id="boot" class="screen boot">
  <img class="boot-logo" src="assets/orion.svg" alt="Orion" width="112" height="112">
  <div class="boot-spinner"><i></i></div>
  <div class="boot-text">Starting Orion</div>
</div>

<!-- ============ LOCK ============ -->
<div id="lock" class="screen lock hidden">
  <div class="lock-clock">
    <div id="lockTime" class="lock-time">9:41</div>
    <div id="lockDate" class="lock-date">Monday, January 1</div>
  </div>
  <div class="lock-user">
    <div class="lock-avatar"></div>
    <div class="lock-name">Chase</div>
    <button id="signIn" class="lock-signin">Sign in</button>
  </div>
  <div class="lock-hint">Click anywhere or press any key</div>
</div>

<!-- ============ DESKTOP ============ -->
<div id="desktop" class="screen desktop hidden">
  <div id="wallpaper" class="wallpaper"></div>
  <!-- Mac style menu bar (hidden in Windows style) -->
  <div id="macBar">
    <button data-mb="orion" title="Start"><img class="mb-logo" src="assets/orion.svg" alt="Orion"></button>
    <button class="mb-app" id="macAppName" data-mb="orion">Orion</button>
    <button data-mb="min">Window</button>
    <button class="mb-gear" data-mb="settings" title="Settings"></button>
    <span class="mb-spacer"></span>
    <span class="mb-right">
      <button class="mb-vpn hidden" id="macVpn" data-mb="vpn" title="Orion VPN"></button>
      <button class="mb-status" id="macStatus" data-mb="quick" title="Control centre"></button>
      <button data-mb="search" title="Search"></button>
      <button data-mb="bell" title="Notifications"></button>
      <button data-mb="orion" id="macUser">Orion</button>
      <span id="macClock">9:41</span>
    </span>
  </div>

  <div id="iconLayer" class="icon-layer"></div>

  <div id="windowLayer" class="window-layer"></div>
  <div id="snapPreview" class="snap-preview hidden"></div>

  <!-- Start menu -->
  <div id="startMenu" class="flyout start-menu hidden">
    <div class="start-search">
      <span class="si"></span>
      <input id="startSearch" type="text" placeholder="Search for apps, settings, and documents" spellcheck="false">
    </div>
    <div class="start-section">
      <div class="start-head"><span>Pinned</span><button class="pill" data-all-apps>All apps &rsaquo;</button></div>
      <div id="startPinned" class="start-grid"></div>
    </div>
    <div class="start-section" id="recSection">
      <div class="start-head"><span>Recommended</span></div>
      <div id="startRecommended" class="start-rec"></div>
    </div>
    <div class="start-footer">
      <button class="start-user"><span class="avatar"></span><span>Chase</span></button>
      <button class="start-power" id="powerBtn" title="Power"></button>
    </div>
  </div>

  <!-- Search overlay -->
  <div id="searchPanel" class="flyout search-panel hidden">
    <div class="search-top">
      <span class="si"></span>
      <input id="searchInput" type="text" placeholder="Type here to search" spellcheck="false">
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- Widgets -->
  <div id="widgetsPanel" class="flyout widgets-panel hidden"></div>

  <!-- Quick settings -->
  <div id="quickPanel" class="flyout quick-panel hidden">
    <div class="quick-grid" id="quickGrid"></div>
    <div class="quick-slider">
      <span class="qs-ico" data-ico="volume"></span>
      <input id="volumeSlider" type="range" min="0" max="100" value="65">
      <span id="volumeVal" class="qs-val">65</span>
    </div>
    <div class="quick-slider">
      <span class="qs-ico" data-ico="brightness"></span>
      <input id="brightSlider" type="range" min="30" max="100" value="100">
      <span id="brightVal" class="qs-val">100</span>
    </div>
    <div class="quick-foot">
      <span id="batteryText">100%</span>
      <button class="icon-btn" data-open-settings title="All settings"></button>
    </div>
  </div>

  <!-- Notification center + calendar -->
  <div id="notifPanel" class="flyout notif-panel hidden">
    <div class="notif-head"><span>Notifications</span><button class="pill" id="clearNotifs">Clear all</button></div>
    <div id="notifList" class="notif-list"></div>
    <div class="cal">
      <div class="cal-head">
        <button class="icon-btn" id="calPrev"></button>
        <span id="calTitle">January 2026</span>
        <button class="icon-btn" id="calNext"></button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- Task view -->
  <div id="taskView" class="task-view hidden">
    <div class="tv-windows" id="tvWindows"></div>
    <div class="tv-desks" id="tvDesks"></div>
  </div>

  <!-- Context menu -->
  <div id="contextMenu" class="context-menu hidden"></div>

  <!-- Toasts -->
  <div id="toastLayer" class="toast-layer"></div>

  <!-- Taskbar -->
  <div id="taskbar" class="taskbar">
    <div class="tb-left" id="tbLeft"></div>
    <div class="tb-center" id="tbCenter"></div>
    <div class="tb-right">
      <button class="tray-btn tray-vpn hidden" id="trayVpn" data-tip="Orion VPN"></button>
      <button class="tray-btn" id="trayChevron" data-tip="Show hidden icons"></button>
      <button class="tray-btn tray-group" id="trayQuick" data-tip="Network, Sound, Battery">
        <span data-ico="wifi"></span><span data-ico="volume"></span><span data-ico="battery"></span>
      </button>
      <button class="tray-clock" id="trayClock">
        <span id="clockTime">9:41 AM</span>
        <span id="clockDate">1/1/2026</span>
      </button>
      <button class="tray-btn tray-bell" id="trayBell" data-tip="Notifications"><span class="badge hidden" id="notifBadge">0</span></button>
      <button class="show-desktop" id="showDesktop" data-tip="Show desktop"></button>
    </div>
  </div>

  <!-- Power / shutdown overlay -->
  <div id="powerOverlay" class="screen power-overlay hidden">
    <div class="boot-spinner"><i></i></div>
    <div class="boot-text" id="powerText">Shutting down</div>
  </div>
</div>

<script src="js/icons.js?v=28"></script>
<script src="js/state.js?v=28"></script>
<script src="js/install.js?v=28"></script>
<script src="js/fullscreen.js?v=28"></script>
<script src="js/net.js?v=28"></script>
<script src="js/proxy.js?v=28"></script>
<script src="js/auth.js?v=28"></script>
<script src="js/vfs.js?v=28"></script>
<script src="js/wm.js?v=28"></script>
<script src="js/games.js?v=28"></script>
<script src="js/apps/edge.js?v=28"></script>
<script src="js/apps/vpn.js?v=28"></script>
<script src="js/apps/store.js?v=28"></script>
<script src="js/apps/access.js?v=28"></script>
<script src="js/apps/youtube.js?v=28"></script>
<script src="js/apps/music.js?v=28"></script>
<script src="js/apps/learn.js?v=28"></script>
<script src="js/apps/office.js?v=28"></script>
<script src="js/apps/creative.js?v=28"></script>
<script src="js/apps/explorer.js?v=28"></script>
<script src="js/apps/notepad.js?v=28"></script>
<script src="js/apps/settings.js?v=28"></script>
<script src="js/apps/calculator.js?v=28"></script>
<script src="js/apps/terminal.js?v=28"></script>
<script src="js/apps/extras.js?v=28"></script>
<script src="js/shell.js?v=28"></script>
<script src="js/tour.js?v=28"></script>
<script src="js/main.js?v=28"></script>
</body>
</html>
